<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  <title>{{ page.title | default: site.title | escape }} | Mechanics</title>
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
  <script defer src="{{ '/assets/js/calculators.js' | relative_url }}"></script>
</head>

<body>
  <header class="page-header">
    <div class="inner">
      <a class="site-home" href="{{ '/' | relative_url }}"><span class="page-title">{{ site.title | escape }}</span></a>
      <p class="page-tagline">{{ site.description | escape }}</p>
    </div>
  </header>

  <div class="content-wrapper">
    <div class="inner page-layout">
      <main id="content" class="markdown-body">
        {{ content }}
      </main>
      <aside class="sidebar" aria-label="Page navigation">
        <div class="sidebar-links">
          <a class="home-link" href="{{ '/' | relative_url }}">Home / README</a>
          <a class="home-link" id="back-link" href="{{ '/' | relative_url }}">← Back to previous page</a>
        </div>
        <nav id="page-toc" aria-label="On this page"></nav>
      </aside>
    </div>
  </div>

  <footer class="page-end">
    <div class="inner">
      ← <a href="{{ '/' | relative_url }}">Back to HOME</a>
    </div>
  </footer>
</body>
</html>
